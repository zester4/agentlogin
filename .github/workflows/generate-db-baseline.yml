name: Generate Drizzle baseline

on:
  push:
    branches: [implementation/db-baseline-generation]
    paths:
      - ".github/workflows/generate-db-baseline.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/db-baseline-generation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate migration from canonical Drizzle schema
        run: pnpm db:generate
      - name: Require generated SQL and metadata
        shell: bash
        run: |
          test -n "$(find db/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
          test -f db/migrations/meta/_journal.json
          git status --short db/migrations
      - name: Commit generated migration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/migrations
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 1
          fi
          git commit -m "chore(database): generate initial Drizzle baseline"
          git push origin HEAD:implementation/db-baseline-generation
